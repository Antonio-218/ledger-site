  function applyImport(text) {
    try {
      var p = JSON.parse(text);
      if (!p || !Array.isArray(p.records) || !Array.isArray(p.books)) throw new Error('bad format');
      S = {
        books: p.books,
        activeBookId: p.activeBookId || p.books[0].id,
        records: p.records,
        accounts: normalizeAccounts(p.accounts, p.activeBookId || p.books[0].id),
        assetsHidden: !!p.assetsHidden,
        categories: normalizeCats(p.categories)
      };
      save(); closeModal(); render(); toast('数据已导入');
    } catch (e) { toast('导入失败：内容格式不正确'); }
  }
  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () { applyImport(reader.result); };
    reader.readAsText(file);
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (a === 'mask') { if (e.target === el) { if (ui.periodOpen) closePeriodPicker(); else closeModal(); } return; }
    if (a === 'close') { if (ui.periodOpen) closePeriodPicker(); else closeModal(); return; }
    if (a === 'sample-add') { recordForm(); return; }
    if (a === 'load-sample') { loadSampleData(); return; }
    if (a === 'prev-month') { ui.month = addMonths(ui.month, -1); render(); return; }
    if (a === 'next-month') { ui.month = addMonths(ui.month, 1); render(); return; }
    if (a === 'stats-type') { ui.statsType = el.getAttribute('data-val'); ui.expandedCat = null; render(); return; }
    if (a === 'cat-bump') { bumpDonut(el); return; }
    if (a === 'cat-toggle') {
      var catVal = el.getAttribute('data-val');
      ui.expandedCat = (ui.expandedCat === catVal ? null : catVal);
      render(); return;
    }
    if (a === 'period-open') {
      ui.periodTarget = el.getAttribute('data-val') === 'account' ? 'account' : 'stats';
      syncWheel(); openPeriodPicker(); return;
    }
    if (a === 'period-close') { closePeriodPicker(); return; }
    if (a === 'period-mode') {
      var mf = activePeriod();
      mf.mode = el.getAttribute('data-val');
      if (mf.mode === 'week') mf.week = 1;
      if (mf.mode === 'custom') syncWheel();
      openPeriodPicker(); return;
    }
    if (a === 'period-step') { shiftPeriod(activePeriod(), Number(el.getAttribute('data-val')) || 0); openPeriodPicker(); return; }
    if (a === 'period-pick') {
      var spv = Number(el.getAttribute('data-val')) || 1, sf = activePeriod();
      if (sf.mode === 'month') sf.month = spv;
      else if (sf.mode === 'year') sf.year = spv;
      else sf.week = spv;
      // 选定周期后收起弹层，下面直接显示该周期的流水 / 统计
      closePeriodPicker(); return;
    }
    if (a === 'period-custom-target') {
      activePeriod().editEnd = el.getAttribute('data-val');
      syncWheel(); openPeriodPicker(); return;
    }
    if (a === 'period-wheel') {
      var wf = activePeriod(), col = el.getAttribute('data-col'), wv = Number(el.getAttribute('data-val'));
      if (col === 'y') wf.wheel.y = wv;
      else if (col === 'm') wf.wheel.m = ((wv - 1 + 12) % 12) + 1;
      else wf.wheel.d = wv;
      var wdim = daysInMonth(wf.wheel.y, wf.wheel.m);
      if (wf.wheel.d > wdim) wf.wheel.d = wdim;
      var wdate = ymd(new Date(wf.wheel.y, wf.wheel.m - 1, wf.wheel.d));
      if (wf.editEnd === 'to') wf.customTo = wdate; else wf.customFrom = wdate;
      openPeriodPicker(); return;
    }
    if (a === 'period-custom-apply') {
      var cf = activePeriod();
      if (cf.customFrom && cf.customTo && cf.customFrom > cf.customTo) {
        var tmp = cf.customFrom; cf.customFrom = cf.customTo; cf.customTo = tmp;
      }
      closePeriodPicker(); return;
    }
    if (a === 'toggle-assets-eye') { S.assetsHidden = !S.assetsHidden; save(); render(); return; }
    if (a === 'toggle-asset-trend') { ui.trendOpen = !ui.trendOpen; render(); return; }
    if (a === 'add-account') { accountForm(); return; }
    if (a === 'open-account') { ui.accountId = id; render(); window.scrollTo(0, 0); return; }
    if (a === 'back-assets') { ui.accountId = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'record-for-account') { recordForm(null, null, id); return; }
    if (a === 'transfer-form') { transferForm(null, id); return; }
    if (a === 'edit-transfer') { transferForm(id); return; }
    if (a === 'submit-transfer') { submitTransfer(id || null); return; }
    if (a === 'edit-account') { accountForm(id); return; }
    if (a === 'pick-account-icon') {
      document.getElementById('aIcon').value = el.getAttribute('data-val');
      document.querySelectorAll('[data-action="pick-account-icon"]').forEach(function (x) { x.classList.toggle('picked', x === el); });
      return;
    }
    if (a === 'submit-account') {
      var an = document.getElementById('aName').value.trim();
      if (!an) { toast('请输入账户名称'); return; }
      var ab = parseFloat(document.getElementById('aBalance').value);
      if (isNaN(ab)) { toast('请输入有效的余额'); return; }
      var anote = document.getElementById('aNote').value.trim();
      var aicon = document.getElementById('aIcon').value;
      var newBal = Math.round(ab * 100) / 100;
      if (id) {
        var oldAcc = findAccount(id);
        var diff = oldAcc ? Math.round((newBal - (Number(oldAcc.balance) || 0)) * 100) / 100 : 0;
        (S.accounts || []).forEach(function (x) { if (x.id === id) { x.name = an; x.balance = newBal; x.icon = aicon; x.note = anote; } });
        // 余额变化生成「余额调整」流水：只反映账户余额变动，不计入当天收入与支出
        if (oldAcc && diff !== 0) {
          S.records.push({
            id: uid(), bookId: oldAcc.bookId || S.activeBookId, type: 'adjust',
            category: '余额调整', amount: Math.abs(diff), delta: diff,
            balanceAfter: newBal, date: ymd(new Date()), note: '余额调整',
            accountId: oldAcc.id
          });
        }
      } else {
        S.accounts = S.accounts || [];
        S.accounts.push({ id: uid(), bookId: S.activeBookId, name: an, balance: newBal, icon: aicon, note: anote });
      }
      save(); closeModal(); render(); toast('账户已保存'); return;
    }
    if (a === 'delete-account') {
      if (confirm('删除这个账户？相关记账记录会保留，但不再计入账户余额。')) {
        S.accounts = (S.accounts || []).filter(function (x) { return x.id !== id; });
        if (ui.accountId === id) ui.accountId = null;
        save(); closeModal(); render(); toast('账户已删除');
      }
      return;
    }
    if (a === 'book-menu') { bookMenu(); return; }
    if (a === 'goto-settings' || a === 'goto-books') { closeModal(); setView('settings'); return; }
    if (a === 'filter-type') { ui.filter.type = el.getAttribute('data-val'); ui.filter.cat = 'all'; render(); return; }
    if (a === 'edit-record') {
      var editRec = S.records.find(function (x) { return x.id === id; });
      if (editRec && editRec.type === 'transfer') { transferForm(id); return; }
      if (editRec && editRec.type === 'adjust') { toast('余额调整记录不可编辑，可删除后重新调整余额'); return; }
      recordForm(id); return;
    }
    if (a === 'delete-record') {
      if (confirm('确定删除这条记录吗？')) {
        var target = S.records.find(function (r) { return r.id === id; });
        if (target) applyRecordDelta(target, -1);
        S.records = S.records.filter(function (r) { return r.id !== id; });
        save(); closeModal(); render(); toast('已删除');
      }
      return;
    }
    if (a === 'switch-type') {
      syncFormFromDOM();
      ui.form.type = el.getAttribute('data-val');
      ui.form.cat = (catsOf(ui.form.type)[0] || {}).name || '其他';
      ui.form.catPage = 0;
      renderRecordForm();
      return;
    }
    if (a === 'pick-cat') {
      syncFormFromDOM();
      ui.form.cat = el.getAttribute('data-cat');
      document.querySelectorAll('.cat-item').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-cat') === ui.form.cat); });
      return;
    }
    // ---------- 分类分页与自定义 ----------
    if (a === 'cat-page') {
      syncFormFromDOM();
      var cpMax = Math.max(1, Math.ceil((catsOf(ui.form.type).length + 1) / CAT_PAGE_SIZE)) - 1;
      ui.form.catPage = Math.min(Math.max(ui.form.catPage + (Number(el.getAttribute('data-val')) || 0), 0), cpMax);
      renderRecordForm(); return;
    }
    if (a === 'cat-add') { syncFormFromDOM(); categoryForm(null, ui.form.type, 'record'); return; }
    if (a === 'open-cat-manager') { syncFormFromDOM(); ui.catMgrType = ui.form.type; categoryManager(); return; }
    if (a === 'cat-mgr-type') { ui.catMgrType = el.getAttribute('data-val'); categoryManager(); return; }
    if (a === 'cat-mgr-add') { categoryForm(null, ui.catMgrType, 'manager'); return; }
    if (a === 'cat-edit') { categoryForm(id, ui.catMgrType, 'manager'); return; }
    if (a === 'cat-mgr-done') { renderRecordForm(); return; }
    if (a === 'cat-form-cancel') {
      if (ui.catFormReturn === 'manager') categoryManager(); else renderRecordForm();
      return;
    }
    if (a === 'cat-move') {
      var mvList = ensureCats()[ui.catMgrType], mi = -1, k;
      for (k = 0; k < mvList.length; k++) if (mvList[k].name === id) { mi = k; break; }
      var mj = mi + (Number(el.getAttribute('data-val')) || 0);
      if (mi >= 0 && mj >= 0 && mj < mvList.length) {
        var mvTmp = mvList[mi]; mvList[mi] = mvList[mj]; mvList[mj] = mvTmp;
        ui.form.catPage = catPageOf(ui.form.type, ui.form.cat);
        save(); categoryManager();
      }
      return;
    }
    if (a === 'cat-del') {
      var delType = ui.catMgrType, delList = ensureCats()[delType];
      if (delList.length <= 1) { toast('至少保留一个分类'); return; }
      var usedCnt = S.records.filter(function (r) { return r.type === delType && r.category === id; }).length;
      if (!confirm('删除分类「' + id + '」？' + (usedCnt ? '已有 ' + usedCnt + ' 笔记录使用它，删除后这些记录仍保留原名称。' : ''))) return;
      S.categories[delType] = delList.filter(function (c) { return c.name !== id; });
      if (ui.form && ui.form.type === delType && ui.form.cat === id) ui.form.cat = catsOf(delType)[0].name;
      ui.form.catPage = catPageOf(ui.form.type, ui.form.cat);
      save(); categoryManager(); toast('分类已删除'); return;
    }
    if (a === 'pick-cat-icon') {
      document.getElementById('cfIcon').value = el.getAttribute('data-val');
      document.querySelectorAll('[data-action="pick-cat-icon"]').forEach(function (x) { x.classList.toggle('picked', x === el); });
      return;
    }
    if (a === 'pick-cat-color') {
      document.getElementById('cfColor').value = el.getAttribute('data-val');
      document.querySelectorAll('[data-action="pick-cat-color"]').forEach(function (x) { x.classList.toggle('picked', x === el); });
      return;
    }
    if (a === 'submit-cat-form') {
      var cfName = document.getElementById('cfName').value.trim();
      if (!cfName) { toast('请输入分类名称'); return; }
      var cfType = document.getElementById('cfType').value;
      var cfIcon = document.getElementById('cfIcon').value || '📦';
      var cfColor = document.getElementById('cfColor').value || '#94a3b8';
      var cfCats = ensureCats(), cfOld = id || '';
      if (cfCats[cfType].some(function (c) { return c.name === cfName && c.name !== cfOld; })) { toast('这个分类名称已经存在了'); return; }
      if (cfOld) {
        cfCats[cfType].forEach(function (c) { if (c.name === cfOld) { c.name = cfName; c.icon = cfIcon; c.color = cfColor; } });
        S.records.forEach(function (r) { if (r.type === cfType && r.category === cfOld) r.category = cfName; });
        if (ui.form.type === cfType && ui.form.cat === cfOld) ui.form.cat = cfName;
      } else {
        cfCats[cfType].push({ name: cfName, icon: cfIcon, color: cfColor });
        if (ui.form.type === cfType) ui.form.cat = cfName;
      }
      ui.catMgrType = cfType;
      ui.form.catPage = catPageOf(ui.form.type, ui.form.cat);
      save();
      if (ui.catFormReturn === 'manager') categoryManager(); else renderRecordForm();
      toast('分类已保存'); return;
    }
    if (a === 'submit-record') { submitRecord(id || null); return; }
    if (a === 'cal-day') { ui.selectedDate = el.getAttribute('data-date'); render(); return; }
    if (a === 'add-on-date') { recordForm(null, el.getAttribute('data-date')); return; }
    if (a === 'add-book') { bookForm(); return; }
    if (a === 'edit-book') { bookForm(id); return; }
    if (a === 'switch-book') { S.activeBookId = id; ui.accountId = null; save(); closeModal(); render(); toast('已切换账本'); return; }
    if (a === 'delete-book') {
      if (S.books.length <= 1) { toast('至少保留一个账本'); return; }
      var cnt = S.records.filter(function (r) { return r.bookId === id; }).length;
      var acnt = (S.accounts || []).filter(function (a) { return a.bookId === id; }).length;
      if (confirm('删除该账本及其 ' + cnt + ' 条记录、' + acnt + ' 个资产账户？此操作不可恢复。')) {
        S.books = S.books.filter(function (b) { return b.id !== id; });
        S.records = S.records.filter(function (r) { return r.bookId !== id; });
        S.accounts = (S.accounts || []).filter(function (a) { return a.bookId !== id; });
        if (S.activeBookId === id) S.activeBookId = S.books[0].id;
        save();
        render();
        toast('账本已删除');
      }
      return;
    }
    if (a === 'pick-book-color') {
      document.getElementById('bColor').value = el.getAttribute('data-val');
      document.querySelectorAll('[data-action="pick-book-color"]').forEach(function (x) { x.classList.toggle('picked', x === el); });
      return;
    }
    if (a === 'pick-book-icon') {
      document.getElementById('bIcon').value = el.getAttribute('data-val');
      document.querySelectorAll('[data-action="pick-book-icon"]').forEach(function (x) { x.classList.toggle('picked', x === el); });
      return;
    }
    if (a === 'submit-book') {
      var nm = document.getElementById('bName').value.trim();
      if (!nm) { toast('请输入账本名称'); return; }
      var color = document.getElementById('bColor').value, icon = document.getElementById('bIcon').value;
      if (id) {
        S.books.forEach(function (b) { if (b.id === id) { b.name = nm; b.color = color; b.icon = icon; } });
      } else {
        var nid = uid();
        S.books.push({ id: nid, name: nm, color: color, icon: icon });
        S.activeBookId = nid;
      }
      save(); closeModal(); render(); toast('账本已保存'); return;
    }
    if (a === 'export') { exportData(); return; }
    if (a === 'copy-backup') { copyBackup(); return; }
    if (a === 'download-backup') { doDownload(); return; }
    if (a === 'import') { showImportModal(); return; }
    if (a === 'import-paste') {
      var txt = (document.getElementById('importText') || {}).value;
      if (txt && txt.trim()) applyImport(txt.trim());
      else toast('请先粘贴备份内容');
      return;
    }
    if (a === 'import-file') {
      var fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
      fi.onchange = function () { if (fi.files && fi.files[0]) importData(fi.files[0]); };
      fi.click(); return;
    }
    if (a === 'clear') {
      if (confirm('确定清空所有数据吗？此操作不可恢复！')) {
        if (confirm('再次确认：真的要删除全部账本和记录？')) {
          S = defaultState(); save(); render(); toast('数据已清空');
        }
      }
      return;
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-action') === 'filter-cat') { ui.filter.cat = el.value; render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'kwInput') { ui.filter.kw = e.target.value; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'kwInput') { render(); }
    if (e.key === 'Escape') { if (ui.periodOpen) closePeriodPicker(); else closeModal(); }
    if (e.key === 'Enter' && e.target.id === 'fAmount') { var btn = document.querySelector('[data-action="submit-record"]'); if (btn) btn.click(); }
  });

  document.querySelectorAll('[data-view]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var v = a.getAttribute('data-view');
      if (v === 'assets') ui.accountId = null; // 点导航回资产总览
      setView(v);
    });
  });

  // ---------- init ----------
  load();
  setView('home');
})();

</script>
</body>
</html>
